{
  "cluster": {
    "name": "elektro",
    "id": 1
  },
  "kubeProxyReplacement": true,
  "k8sServiceHost": "192.168.2.153",
  "k8sServicePort": 6443,
  "ipam": {
    "mode": "kubernetes"
  },
  "routingMode": "tunnel",
  "tunnelProtocol": "vxlan",
  "bpf": {
    "masquerade": true
  },
  "l2announcements": {
    "enabled": false
  },
  "gatewayAPI": {
    "enabled": true,
    "gatewayClass": {
      "create": "false"
    },
    "hostNetwork": {
      "enabled": true,
      "nodes": {
        "matchLabels": {
          "elektro.internal/edge": "true"
        }
      }
    }
  },
  "envoy": {
    "enabled": true,
    "prometheus": {
      "enabled": true
    },
    "securityContext": {
      "capabilities": {
        "keepCapNetBindService": true,
        "envoy": [
          "NET_ADMIN",
          "SYS_ADMIN",
          "NET_BIND_SERVICE"
        ]
      }
    }
  },
  "operator": {
    "replicas": 1,
    "tolerations": [
      {
        "operator": "Exists"
      }
    ],
    "prometheus": {
      "enabled": true
    },
    "dashboards": {
      "enabled": true
    }
  },
  "dashboards": {
    "enabled": true
  },
  "prometheus": {
    "enabled": true
  },
  "certgen": {
    "tolerations": [
      {
        "operator": "Exists"
      }
    ]
  },
  "hubble": {
    "enabled": true,
    "tls": {
      "enabled": true,
      "auto": {
        "enabled": true,
        "method": "cronJob"
      }
    },
    "relay": {
      "enabled": true,
      "tolerations": [
        {
          "operator": "Exists"
        }
      ],
      "prometheus": {
        "enabled": true
      }
    },
    "ui": {
      "enabled": true,
      "tolerations": [
        {
          "operator": "Exists"
        }
      ]
    },
    "metrics": {
      "enabled": [
        "dns",
        "drop",
        "tcp",
        "flow",
        "icmp",
        "httpV2:exemplars=true;labelsContext=source_namespace,destination_namespace"
      ],
      "enableOpenMetrics": true,
      "dashboards": {
        "enabled": true
      }
    }
  }
}
