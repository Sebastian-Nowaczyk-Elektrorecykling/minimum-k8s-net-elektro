apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: internal-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-wildcard
  namespace: gateway-system
spec:
  secretName: internal-wildcard-tls
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - ${DOMAIN}
    - '*.${DOMAIN}'
    - '*.${ADMIN_DOMAIN}'
    - '*.${MANAGEMENT_DOMAIN}'
    - '*.${TESTING_DOMAIN}'
    - '*.${STAGING_DOMAIN}'
  issuerRef: {name: internal-ca, kind: ClusterIssuer}
