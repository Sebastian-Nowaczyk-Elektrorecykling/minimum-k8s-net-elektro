apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-proxy
  namespace: administration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-proxy
  template:
    metadata:
      labels:
        app: admin-proxy
      annotations:
        elektro.internal/config-revision: ${CONFIG_REVISION}
    spec:
      automountServiceAccountToken: false
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: ${NGINX_IMAGE}
        command:
        - nginx
        - -g
        - daemon off;
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: auth
          mountPath: /etc/admin-auth
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: admin-proxy
      - name: auth
        secret:
          secretName: admin-credentials
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: admin-proxy
  namespace: administration
spec:
  selector:
    app: admin-proxy
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: admin-proxy-from-gateway
  namespace: administration
spec:
  endpointSelector:
    matchLabels:
      app: admin-proxy
  ingress:
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
