apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: administration
  namespace: administration
spec:
  parentRefs:
    - {name: internal, namespace: gateway-system, sectionName: admin-https}
  hostnames:
    - hubble.${ADMIN_DOMAIN}
  rules:
    - backendRefs:
        # Direct during bootstrap. Later point these settings at an SSO proxy
        # Service owned by your platform repository; this route retains one owner.
        - name: ${HUBBLE_BACKEND_SERVICE}
          namespace: ${HUBBLE_BACKEND_NAMESPACE}
          port: ${HUBBLE_BACKEND_PORT}
