apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: administration
  namespace: administration
spec:
  parentRefs:
    - {name: internal, namespace: gateway-system, sectionName: admin-https}
  hostnames:
    - hubble.${ADMIN_DOMAIN}
  rules:
    - backendRefs:
        - {name: admin-proxy, port: 80}
