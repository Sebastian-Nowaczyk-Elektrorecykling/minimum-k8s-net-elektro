# Permit administration routes to reach only the selected backend Service.
# Gateway API requires the grant in the backend's namespace for cross-namespace
# references. It is harmless when the backend is in administration itself.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: hubble-backend
  namespace: ${HUBBLE_BACKEND_NAMESPACE}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: administration
  to:
    - group: ''
      kind: Service
      name: ${HUBBLE_BACKEND_SERVICE}
