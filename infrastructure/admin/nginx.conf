worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver ${CLUSTER_DNS_IP} ipv6=off valid=30s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $host $backend {
    default '';
    hubble.${ADMIN_DOMAIN} hubble-ui.kube-system.svc.cluster.local:80;
  }
  server {
    listen 8080;
    server_name _;
    if ($backend = '') { return 404; }
    location / {
      auth_basic "Cluster administration";
      auth_basic_user_file /etc/admin-auth/auth;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Avoid passing the shared administration password to upstream tools.
      proxy_set_header Authorization "";
      proxy_read_timeout 300s;
      proxy_pass http://$backend;
    }
  }
  server {
    listen 8081;
    location = /healthz { access_log off; return 200 'ok'; }
  }
}
