# Copy into apps/ and add to apps/kustomization.yaml to deploy the smoke test.
# For testing, use listener testing-https and hostname whoami.${TESTING_DOMAIN}.
# For staging, use listener staging-https and hostname whoami.${STAGING_DOMAIN}.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: apps
spec:
  replicas: 1
  selector: {matchLabels: {app: whoami}}
  template:
    metadata: {labels: {app: whoami}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          args: [--port=8080]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata: {name: whoami, namespace: apps}
spec:
  selector: {app: whoami}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: whoami, namespace: apps}
spec:
  parentRefs:
    - {name: internal, namespace: gateway-system, sectionName: apps-https}
  hostnames: ['whoami.${DOMAIN}']
  rules:
    - backendRefs: [{name: whoami, port: 80}]
